# Lint, type-check, unit-test and build the package. No cluster: the tests don't need one.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: make check
      - name: uv build (the wheel is pure Python, so one cell is enough)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv build

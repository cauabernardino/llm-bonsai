name: Bug
description: Something in the lab or the CLI doesn't work as the README says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output of the failing command. The keys are dev-only, but remove any before you paste.
      render: text
    validations:
      required: true
  - type: textarea
    id: preflight
    attributes:
      label: llm-bonsai setup preflight
      description: Its full output, which describes your machine and tool versions. Its disk path may include your username.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`llm-bonsai --version`, and the commit: `git rev-parse --short HEAD` in a checkout, or the date you ran `uv tool install`."
    validations:
      required: true

[project]
name = "llm-bonsai"
version = "0.1.0"
description = "A tiny local GenAI platform lab: LiteLLM + Langfuse + Ollama on Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.29.0",
    "openai>=3.60.0",
    "python-dotenv>=1.2.4",
    "typer>=0.29.3",
]

[project.scripts]
llm-bonsai = "llm_bonsai.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # README snippets are prose, formatted by hand

[tool.ruff.lint]
select = [
    "E", "W", "F", # pycodestyle, pyflakes
    "I",           # import order
    "UP",          # modern syntax for the target version
    "B",           # likely bugs
    "SIM",         # simplifications
    "RUF",         # ruff's own rules
    "PTH",         # pathlib over os.path
    "S",           # security (subprocess, asserts, ...)
]
ignore = [
    "S101", # assert is how the smoke checks and tests state expectations
    "S603", # subprocess with a list argv is the intended use
    "S607", # kubectl/helm/minikube are resolved from PATH on purpose
    "RUF001", # en dashes and arrows in output text are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.pyright]
venvPath = "."
venv = ".venv"
